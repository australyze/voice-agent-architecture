services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: voice_agent
      POSTGRES_PASSWORD: voice_agent
      POSTGRES_DB: voice_agent
    # Local-only: do not publish on all interfaces. Do not reuse these credentials outside local Compose.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_agent -d voice_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - voice_agent_pg:/var/lib/postgresql/data

volumes:
  voice_agent_pg:
