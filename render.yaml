# Exported from Render-oriented deploy notes for HU #012.
# Secrets must be set in the Render dashboard, not in this file.

services:
  - type: web
    name: voice-agent-architecture
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: LISTEN_HOST
        value: 0.0.0.0
      - key: PORT
        generateValue: false
      - key: DATABASE_URL
        sync: false
      - key: VOICE_INBOUND_SECRET
        sync: false
      - key: DEMO_ORCHESTRATE_SECRET
        sync: false
      - key: DEMO_PUBLIC_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: VOICE_SESSION_OWNER
        value: wom-customer-service-agent
      - key: VOICE_REASONING_OWNER
        value: vapi
      - key: LLM_MODEL_ID
        value: fake
