openapi: 3.0.3
info:
  title: AI Agent Runtime Health API
  description: |
    Operational health probes and the inbound voice adapter surface.
    Canonical product session and /ingress/interaction contracts remain in
    lidr-specboot/docs/api-spec.yml. The Vapi-facing URL is
    POST /adapters/voice/inbound, not /ingress/interaction.
  version: 0.2.0
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /health/live:
    get:
      summary: Process liveness
      operationId: getLiveness
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
        "500":
          $ref: "#/components/responses/Error"
  /health/ready:
    get:
      summary: Readiness including persistence
      operationId: getReadiness
      responses:
        "200":
          description: Essential dependencies are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /health/voice:
    get:
      summary: Voice integration diagnostic
      operationId: getVoiceIntegration
      responses:
        "200":
          description: Voice integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceIntegrationResponse"
        "500":
          $ref: "#/components/responses/Error"
  /adapters/voice/inbound:
    post:
      summary: Inbound voice adapter (synchronous reply)
      operationId: postVoiceInbound
      parameters:
        - in: header
          name: x-voice-inbound-secret
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceInboundRequest"
      responses:
        "200":
          description: Mapped runtime agent reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceConsumerReply"
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Canonical error envelope from lidr-specboot/docs/api-spec.yml
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    LivenessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [alive]
    ReadinessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    VoiceIntegrationResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [configured, not_configured, error]
        code:
          type: string
    VoiceInboundRequest:
      type: object
      additionalProperties: false
      required: [eventType, occurredAt]
      properties:
        eventType:
          type: string
          maxLength: 64
        occurredAt:
          type: string
          format: date-time
        externalChannelId:
          type: string
          maxLength: 128
        interactionId:
          type: string
          maxLength: 128
        requestId:
          type: string
          maxLength: 128
        inputText:
          type: string
          maxLength: 4096
        sessionId:
          type: string
          format: uuid
          maxLength: 36
    VoiceConsumerReply:
      type: object
      required: [message, locale, status]
      properties:
        message:
          type: string
        locale:
          type: string
        status:
          type: string
          enum: [ok]
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
            code:
              type: string
            details:
              nullable: true
