openapi: 3.0.3
info:
  title: AI Agent Runtime Health API
  description: |
    Operational health probes, inbound voice, and the demo orchestrate surface.
    Canonical product session and /ingress/interaction contracts remain in
    lidr-specboot/docs/api-spec.yml. The Vapi-facing URL is
    POST /adapters/voice/inbound, not /ingress/interaction.
    Multi-agent demo ingress is POST /demo/orchestrate.
    Session history reads are GET /sessions and GET /sessions/{sessionId}
    (canonical resources in lidr-specboot/docs/api-spec.yml).
  version: 0.3.0
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /health/live:
    get:
      summary: Process liveness
      operationId: getLiveness
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
        "500":
          $ref: "#/components/responses/Error"
  /health/ready:
    get:
      summary: Readiness including persistence
      operationId: getReadiness
      responses:
        "200":
          description: Essential dependencies are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /health/voice:
    get:
      summary: Voice integration diagnostic
      operationId: getVoiceIntegration
      responses:
        "200":
          description: Voice integration status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceIntegrationResponse"
        "500":
          $ref: "#/components/responses/Error"
  /adapters/voice/inbound:
    post:
      summary: Inbound voice adapter (synchronous reply)
      operationId: postVoiceInbound
      parameters:
        - in: header
          name: x-voice-inbound-secret
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceInboundRequest"
      responses:
        "200":
          description: Mapped runtime agent reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceConsumerReply"
        "400":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /demo/orchestrate:
    post:
      summary: Route a demo request through the orchestrator
      description: Closed-intent demo path. When DEMO_ORCHESTRATE_SECRET or VOICE_INBOUND_SECRET is set, send x-demo-orchestrate-secret. Body limit 16KiB. Failures use the canonical envelope (unroutable, invalid_output, unauthorized, payload_invalid, and related codes).
      operationId: orchestrateDemoTurn
      parameters:
        - in: header
          name: x-demo-orchestrate-secret
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrchestrateRequest"
      responses:
        "200":
          description: Structured specialist result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrchestrateSuccess"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "413":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "502":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "504":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /sessions:
    get:
      summary: List recent persisted voice sessions
      operationId: listSessions
      parameters:
        - in: header
          name: x-demo-orchestrate-secret
          required: true
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: externalChannelId
          schema:
            type: string
      responses:
        "200":
          description: Lightweight session list
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
        "401":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /sessions/{sessionId}:
    get:
      summary: Get a persisted session report
      operationId: getSession
      parameters:
        - in: header
          name: x-demo-orchestrate-secret
          required: true
          schema:
            type: string
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Provider-independent session report
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, evaluation]
                properties:
                  evaluation:
                    nullable: true
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Canonical error envelope from lidr-specboot/docs/api-spec.yml
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    LivenessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [alive]
    ReadinessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    VoiceIntegrationResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [configured, not_configured, error]
        code:
          type: string
    VoiceInboundRequest:
      type: object
      additionalProperties: false
      required: [eventType, occurredAt]
      properties:
        eventType:
          type: string
          maxLength: 64
        occurredAt:
          type: string
          format: date-time
        externalChannelId:
          type: string
          maxLength: 128
        interactionId:
          type: string
          maxLength: 128
        requestId:
          type: string
          maxLength: 128
        inputText:
          type: string
          maxLength: 4096
        sessionId:
          type: string
          format: uuid
          maxLength: 36
    OrchestrateRequest:
      type: object
      required: [userText, intent]
      properties:
        userText:
          type: string
          minLength: 1
          maxLength: 4096
        intent:
          type: string
          enum: [normalize, classify]
        locale:
          type: string
        sessionId:
          type: string
          format: uuid
          maxLength: 36
    OrchestrateSuccess:
      type: object
      required: [sessionId, intent, specialistId, replyText]
      properties:
        sessionId:
          type: string
        intent:
          type: string
          enum: [normalize, classify]
        specialistId:
          type: string
          enum: [demo-normalize, demo-classify]
        replyText:
          type: string
        normalizedText:
          type: string
        label:
          type: string
    VoiceConsumerReply:
      type: object
      required: [message, locale, status]
      properties:
        message:
          type: string
        locale:
          type: string
        status:
          type: string
          enum: [ok]
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
            code:
              type: string
            details:
              nullable: true
