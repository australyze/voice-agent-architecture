openapi: 3.0.3
info:
  title: AI Agent Runtime Health API
  description: |
    Operational health probes for the implementing runtime.
    Product session, tool, and ingress contracts remain in
    lidr-specboot/docs/api-spec.yml and are not implemented here.
  version: 0.1.0
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /health/live:
    get:
      summary: Process liveness
      operationId: getLiveness
      responses:
        "200":
          description: Process is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivenessResponse"
        "500":
          $ref: "#/components/responses/Error"
  /health/ready:
    get:
      summary: Readiness including persistence
      operationId: getReadiness
      responses:
        "200":
          description: Essential dependencies are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Canonical error envelope from lidr-specboot/docs/api-spec.yml
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    LivenessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [alive]
    ReadinessResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [message, code]
          properties:
            message:
              type: string
            code:
              type: string
            details:
              nullable: true
